name: Keep Choreo Alive

on:
  schedule:
    # 每 10 分钟触发一次，可根据 Choreo 免费策略调整
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mikutap endpoints
        env:
          APP_URLS: ${{ vars.APP_URLS }}
        run: |
          if [ -z "$APP_URLS" ]; then
            echo "APP_URLS repository variable is not set. Skipping keepalive pings."
            echo "Please set it in Settings -> Secrets and variables -> Actions -> Variables"
            echo "Format: https://mikutap-xxx.choreo.dev,https://mikutap-yyy.choreo.dev"
            exit 0
          fi

          IFS=',' read -ra URLS <<< "$APP_URLS"
          for raw in "${URLS[@]}"; do
            url=$(echo "$raw" | xargs)
            [ -z "$url" ] && continue
            ping_url="${url%/}/health"
            echo "Pinging $ping_url"
            curl -fsS --max-time 30 "$ping_url" || echo "Ping failed for $ping_url"
          done
